name: Release Build & Publish

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-release:
    name: Build & Release Dumbo
    runs-on: windows-latest
    timeout-minutes: 45

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Build and release Tauri application
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Dumbo ${{ github.ref_name }}'
          releaseBody: 'See [CHANGELOG.md](https://github.com/Lolaplex/dumbo/blob/main/CHANGELOG.md) for details.'
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
          args: --config src-tauri/tauri.release.conf.json

  notify-success:
    name: Notify Release Published
    needs: [build-release]
    if: ${{ success() }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Post release success to Discord
        env:
          WEBHOOK_URL: ${{ secrets.RELEASE_WEBHOOK_URL }}
        run: |
          if [ -z "$WEBHOOK_URL" ]; then
            echo "::warning::RELEASE_WEBHOOK_URL unset; skip notification"
            exit 0
          fi
          PAYLOAD=$(python3 -c "import json, os; repo=os.environ['GITHUB_REPOSITORY']; server=os.environ['GITHUB_SERVER_URL']; tag=os.environ['GITHUB_REF_NAME']; run_url=f'{server}/{repo}/actions/runs/{os.environ[\"GITHUB_RUN_ID\"]}'; repo_url=f'{server}/{repo}'; release_url=f'{server}/{repo}/releases/tag/{tag}'; print(json.dumps({'embeds':[{'title':f'🚀 Release {tag} Published! — {repo}','url':release_url,'description':f\"Tag \`{tag}\` published\\n[View run]({run_url}) · [Repository]({repo_url}) · [Release]({release_url})\",'color':3066993}]}))")
          curl -fsS -X POST -H 'Content-Type: application/json' -d "$PAYLOAD" "$WEBHOOK_URL"

  notify-failure:
    name: Notify Publish Failure
    needs: [build-release]
    if: ${{ failure() && !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Post publish failure to CI webhook
        env:
          WEBHOOK_URL: ${{ secrets.CI_WEBHOOK_URL }}
        run: |
          if [ -z "$WEBHOOK_URL" ]; then
            echo "::warning::CI_WEBHOOK_URL unset; skip notification"
            exit 0
          fi
          PAYLOAD=$(python3 -c "import json, os; repo=os.environ['GITHUB_REPOSITORY']; server=os.environ['GITHUB_SERVER_URL']; tag=os.environ['GITHUB_REF_NAME']; run_url=f'{server}/{repo}/actions/runs/{os.environ[\"GITHUB_RUN_ID\"]}'; repo_url=f'{server}/{repo}'; print(json.dumps({'embeds':[{'title':f'🔴 Publish Failure: {repo}','url':run_url,'description':f\"Workflow **{os.environ['GITHUB_WORKFLOW']}** failed on tag \`{tag}\`\\n[View run]({run_url}) · [Repository]({repo_url})\",'color':15158332}]}))")
          curl -fsS -X POST -H 'Content-Type: application/json' -d "$PAYLOAD" "$WEBHOOK_URL"
